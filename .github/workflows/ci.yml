name: Windows build and checks
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Source and Windows integration tests
    runs-on: windows-2022
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Run source and Windows integration tests
        run: python -B -m unittest discover -s tests -v

  windows:
    needs: checks
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Compile unsigned laboratory driver and execute policy tests
        run: python -B native/build.py --output "${{ runner.temp }}/native"
      - name: Build and Defender-check the replaceable-library app layout
        shell: pwsh
        run: ./tools/build-app.ps1 -OutputRoot "$env:RUNNER_TEMP/app" -Layout onedir
      - name: Package transparent preview and source snapshot
        run: python -B tools/package_release.py --app "${{ runner.temp }}/app/dist/DiscordGuard" --native "${{ runner.temp }}/native" --output "${{ runner.temp }}/release"
      - name: Upload preview artifacts (not a signed driver release)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: DiscordGuard-preview-windows-x64
          path: |
            ${{ runner.temp }}/release/*.zip
            ${{ runner.temp }}/release/*.exe
            ${{ runner.temp }}/release/*.json
            ${{ runner.temp }}/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
