name: Draft an experimental release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing reviewed tag, for example v0.6.0'
        required: true
        type: string

permissions:
  contents: read

jobs:
  preview:
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Validate tag as data
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python -c "import os,re; assert re.fullmatch(r'v\d+\.\d+\.\d+(?:-[A-Za-z0-9.-]+)?',os.environ['RELEASE_TAG'])"
      - run: python -m pip install -r requirements-build.txt
      - shell: pwsh
        run: ./build.ps1 -OutputRoot "$env:RUNNER_TEMP/app" -Layout onedir
      - run: python -B native/build.py --output "${{ runner.temp }}/native"
      - run: python -B tools/package_release.py --app "${{ runner.temp }}/app/dist/DiscordGuard" --native "${{ runner.temp }}/native" --output "${{ runner.temp }}/release"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reviewed-preview
          path: ${{ runner.temp }}/release/*
          if-no-files-found: error

  draft:
    needs: preview
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      actions: read
    steps:
      - name: Create draft only, with no unreviewed signing keys
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
          RUN_ID: ${{ github.run_id }}
        run: |
          gh run download "$RUN_ID" --name reviewed-preview --dir release
          gh release create "$RELEASE_TAG" release/* --verify-tag --draft --prerelease --title "DiscordGuard $RELEASE_TAG experimental" --notes "Experimental unsigned build. GuardCore is not deployed or runtime-validated; see SECURITY.md and docs/RELEASING.md."
