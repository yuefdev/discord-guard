[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "discord-guard"
version = "0.8.0"
description = "A Windows account-isolated launcher for the official Discord desktop client"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["PySide6>=6.8,<7"]

[project.optional-dependencies]
build = ["PyInstaller==6.22.3"]

[project.gui-scripts]
discord-guard = "discord_guard.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
discord_guard = ["scripts/*.ps1"]
